name: Back up public sightings

on:
  schedule:
    - cron: '23 9 * * *'
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/backup-sightings.yml'
      - 'scripts/backup-sightings.cjs'
      - 'sightings-store.js'
      - 'config.js'

permissions:
  contents: write

concurrency:
  group: sightings-backup
  cancel-in-progress: false

jobs:
  backup:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '24'
      - name: Verify backup and cache checks
        run: node --test tests/*.test.cjs
      - name: Back up sightings and public photos
        run: |
          for attempt in 1 2 3; do
            if node scripts/backup-sightings.cjs; then exit 0; fi
            sleep 20
          done
          exit 1
      - name: Save the successful backup
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/sightings.json data/photos
          git diff --cached --quiet && exit 0
          git commit -m 'Refresh public sightings backup'
          git pull --rebase origin main
          git push origin HEAD:main
