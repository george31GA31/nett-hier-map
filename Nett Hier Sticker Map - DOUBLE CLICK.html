<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="theme-color" content="#ffe100" />
  <meta
    name="description"
    content="A world map of Nett hier. Aber waren Sie schon mal in Baden-Württemberg? sticker sightings."
  />
  <title>Nett hier. Sticker Map</title>

  <!-- The only things loaded from the internet are the map library and map tiles. -->
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  <link rel="stylesheet" href="https://unpkg.com/leaflet.markercluster@1.5.3/dist/MarkerCluster.css" />
  <link rel="stylesheet" href="https://unpkg.com/leaflet.markercluster@1.5.3/dist/MarkerCluster.Default.css" />

  <style>
:root {
  --yellow: #ffe100;
  --yellow-deep: #f1cf00;
  --ink: #171717;
  --muted: #686868;
  --paper: #ffffff;
  --line: #dedede;
  --green: #16844b;
  --danger: #b42318;
  --shadow: 0 18px 55px rgba(0, 0, 0, 0.16);
}

* {
  box-sizing: border-box;
}

html,
body {
  margin: 0;
  min-height: 100%;
  color: var(--ink);
  background: #f5f4ef;
  font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
}

button,
input,
textarea {
  font: inherit;
}

button {
  cursor: pointer;
}

.site-header {
  min-height: 92px;
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 24px;
  padding: 12px 24px;
  background: var(--paper);
  border-bottom: 1px solid #ececec;
  position: relative;
  z-index: 500;
}

.brand {
  display: block;
  width: min(280px, 43vw);
}

.brand img {
  display: block;
  width: 100%;
  height: 66px;
  object-fit: contain;
  object-position: left center;
}

.header-actions {
  display: flex;
  align-items: center;
  gap: 18px;
}

.spot-count {
  display: flex;
  flex-direction: column;
  align-items: flex-end;
  line-height: 1.05;
  white-space: nowrap;
}

.spot-count strong {
  font-size: 24px;
}

.spot-count span {
  margin-top: 4px;
  color: var(--muted);
  font-size: 12px;
  text-transform: uppercase;
  letter-spacing: 0.08em;
}

.primary-button,
.secondary-button,
.icon-button {
  border: 0;
  border-radius: 999px;
  min-height: 44px;
  font-weight: 800;
}

.primary-button {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  gap: 8px;
  padding: 0 18px;
  color: var(--ink);
  background: var(--yellow);
  box-shadow: inset 0 0 0 1px rgba(0,0,0,.06);
}

.primary-button:hover {
  background: var(--yellow-deep);
}

.primary-button:disabled {
  opacity: 0.58;
  cursor: wait;
}

.secondary-button {
  padding: 0 18px;
  background: #f0f0ee;
  color: var(--ink);
}

.plus {
  font-size: 23px;
  line-height: 1;
  margin-top: -2px;
}

.map-shell {
  position: relative;
}

#map {
  width: 100%;
  height: calc(100vh - 92px);
  min-height: 560px;
  background: #dce7e7;
  cursor: grab;
}

.map-shell.adding #map {
  cursor: crosshair;
}

.map-intro,
.add-mode-notice,
.mode-badge {
  position: absolute;
  z-index: 450;
}

.map-intro {
  top: 18px;
  left: 18px;
  width: min(390px, calc(100% - 36px));
  padding: 14px 16px;
  border-radius: 15px;
  background: rgba(255, 255, 255, 0.94);
  box-shadow: 0 8px 30px rgba(0, 0, 0, 0.12);
  backdrop-filter: blur(10px);
}

.map-intro strong,
.map-intro span {
  display: block;
}

.map-intro strong {
  margin-bottom: 3px;
  font-size: 15px;
}

.map-intro span {
  color: #555;
  font-size: 13px;
  line-height: 1.42;
}

.add-mode-notice {
  top: 18px;
  left: 50%;
  transform: translateX(-50%);
  display: flex;
  align-items: center;
  gap: 12px;
  width: max-content;
  max-width: calc(100% - 36px);
  padding: 10px 12px 10px 16px;
  border: 2px solid var(--ink);
  border-radius: 999px;
  background: var(--yellow);
  font-size: 13px;
  font-weight: 800;
  box-shadow: 0 8px 30px rgba(0, 0, 0, 0.16);
}

.add-mode-notice[hidden] {
  display: none;
}

.add-mode-notice button {
  min-height: 34px;
  padding: 0 13px;
  border: 0;
  border-radius: 999px;
  background: var(--ink);
  color: white;
  font-weight: 750;
}

.mode-badge {
  right: 18px;
  bottom: 24px;
  max-width: min(420px, calc(100% - 36px));
  padding: 8px 12px;
  border-radius: 999px;
  color: #4f4f4f;
  background: rgba(255,255,255,.94);
  box-shadow: 0 6px 24px rgba(0,0,0,.11);
  font-size: 12px;
}

.sighting-dialog {
  width: min(610px, calc(100% - 28px));
  max-height: calc(100% - 28px);
  padding: 0;
  border: 0;
  border-radius: 22px;
  overflow: auto;
  background: var(--paper);
  box-shadow: var(--shadow);
}

.sighting-dialog::backdrop {
  background: rgba(0, 0, 0, 0.48);
  backdrop-filter: blur(3px);
}

.sighting-dialog form {
  padding: 24px;
}

.dialog-header {
  display: flex;
  align-items: flex-start;
  justify-content: space-between;
  gap: 20px;
  margin-bottom: 8px;
}

.dialog-header h1 {
  margin: 0;
  font-family: Georgia, "Times New Roman", serif;
  font-size: 34px;
  line-height: 1;
}

.eyebrow {
  margin: 0 0 7px;
  color: #7a6a00;
  font-size: 11px;
  font-weight: 900;
  letter-spacing: 0.14em;
}

.icon-button {
  width: 44px;
  padding: 0;
  background: #f2f2ef;
  color: var(--ink);
  font-size: 27px;
  font-weight: 500;
}

.coordinates {
  margin: 14px 0 18px;
  padding: 10px 12px;
  border: 1px dashed #c8c2a2;
  border-radius: 12px;
  background: #fffced;
  color: #575137;
  font-size: 13px;
}

.field {
  display: block;
  margin-top: 16px;
}

.field > span {
  display: block;
  margin-bottom: 7px;
  font-size: 13px;
  font-weight: 800;
}

.field b {
  color: var(--danger);
}

.field input,
.field textarea {
  width: 100%;
  min-height: 46px;
  border: 1px solid #d4d4d0;
  border-radius: 12px;
  outline: none;
  padding: 11px 12px;
  color: var(--ink);
  background: #fff;
}

.field textarea {
  min-height: 90px;
  resize: vertical;
}

.field input:focus,
.field textarea:focus {
  border-color: #8c7900;
  box-shadow: 0 0 0 3px rgba(255, 225, 0, 0.28);
}

.field small {
  display: block;
  margin-top: 6px;
  color: var(--muted);
  font-size: 12px;
}

.two-col {
  display: grid;
  grid-template-columns: 1.25fr .75fr;
  gap: 12px;
}

.photo-preview-wrap {
  margin-top: 12px;
  overflow: hidden;
  border-radius: 14px;
  border: 1px solid #e1e1dc;
  background: #f2f2f0;
}

.photo-preview-wrap[hidden] {
  display: none;
}

.photo-preview-wrap img {
  display: block;
  width: 100%;
  max-height: 260px;
  object-fit: cover;
}

.form-message {
  min-height: 20px;
  margin: 14px 0 0;
  color: var(--danger);
  font-size: 13px;
}

.form-message.success {
  color: var(--green);
}

.dialog-actions {
  display: flex;
  justify-content: flex-end;
  gap: 10px;
  margin-top: 10px;
}

.nett-marker {
  display: grid;
  place-items: center;
  width: 30px !important;
  height: 30px !important;
  margin-left: -15px !important;
  margin-top: -15px !important;
  border: 3px solid var(--ink);
  border-radius: 50% 50% 50% 10%;
  transform: rotate(-45deg);
  background: var(--yellow);
  box-shadow: 0 3px 10px rgba(0,0,0,.25);
}

.nett-marker span {
  transform: rotate(45deg);
  font: 900 11px/1 Georgia, serif;
}

.marker-cluster-small,
.marker-cluster-medium,
.marker-cluster-large {
  background: rgba(255, 225, 0, .32);
}

.marker-cluster-small div,
.marker-cluster-medium div,
.marker-cluster-large div {
  background: var(--yellow);
  color: var(--ink);
  font-weight: 900;
}

.popup-card {
  width: 220px;
}

.popup-card img {
  display: block;
  width: 100%;
  max-height: 190px;
  object-fit: cover;
  border-radius: 8px;
  margin-bottom: 9px;
  background: #eee;
}

.popup-card strong {
  display: block;
  margin-bottom: 4px;
  font-size: 14px;
}

.popup-card time,
.popup-card p {
  display: block;
  margin: 0;
  color: #666;
  font-size: 12px;
  line-height: 1.4;
}

.popup-card p {
  margin-top: 7px;
  color: #333;
}

.leaflet-popup-content {
  margin: 10px;
}

.leaflet-popup-content-wrapper {
  border-radius: 14px;
}

@media (max-width: 680px) {
  .site-header {
    min-height: 78px;
    padding: 8px 10px;
    gap: 10px;
  }

  .brand {
    width: 175px;
  }

  .brand img {
    height: 58px;
  }

  .spot-count {
    display: none;
  }

  .header-actions {
    gap: 8px;
  }

  .primary-button {
    padding: 0 13px;
    font-size: 13px;
  }

  #map {
    height: calc(100vh - 78px);
    min-height: 520px;
  }

  .map-intro {
    top: 10px;
    left: 10px;
    width: calc(100% - 20px);
  }

  .add-mode-notice {
    top: 10px;
    max-width: calc(100% - 20px);
    border-radius: 14px;
  }

  .mode-badge {
    right: 10px;
    bottom: 18px;
    max-width: calc(100% - 20px);
  }

  .sighting-dialog form {
    padding: 19px;
  }

  .dialog-header h1 {
    font-size: 29px;
  }

  .two-col {
    grid-template-columns: 1fr;
    gap: 0;
  }

  .dialog-actions {
    display: grid;
    grid-template-columns: 1fr 1.35fr;
  }
}

  </style>
</head>

    <div class="header-actions">
      <div class="spot-count" aria-live="polite">
        <strong id="spotCount">0</strong>
        <span>sightings</span>
      </div>
      <button id="addButton" class="primary-button" type="button">
        <span class="plus" aria-hidden="true">+</span>
        Add a sighting
      </button>
    </div>
  </header>

  <main class="map-shell">
    <div id="map" aria-label="World map of sticker sightings"></div>

    <section class="map-intro" id="mapIntro">
      <strong>Seen one?</strong>
      <span>Zoom in, hit “Add a sighting”, then click the exact spot on the map.</span>
    </section>

    <section id="addModeNotice" class="add-mode-notice" hidden>
      <span>Now click the map where you found the sticker.</span>
      <button id="cancelAddMode" type="button">Cancel</button>
    </section>

    <div id="modeBadge" class="mode-badge" role="status"></div>
  </main>

  <dialog id="sightingDialog" class="sighting-dialog">
    <form id="sightingForm" method="dialog">
      <div class="dialog-header">
        <div>
          <p class="eyebrow">NEW SIGHTING</p>
          <h1>Add this sticker</h1>
        </div>
        <button class="icon-button" id="closeDialog" type="button" aria-label="Close">×</button>
      </div>

      <div class="coordinates" id="coordinateText"></div>

      <label class="field">
        <span>Photo <b>*</b></span>
        <input
          id="photoInput"
          name="photo"
          type="file"
          accept="image/*"
          capture="environment"
          required
        />
        <small>Take a photo or choose one from your phone.</small>
      </label>

      <div id="photoPreviewWrap" class="photo-preview-wrap" hidden>
        <img id="photoPreview" alt="Photo preview" />
      </div>

      <div class="two-col">
        <label class="field">
          <span>Place / city</span>
          <input id="placeInput" name="place" type="text" maxlength="120" placeholder="e.g. Dublin, Ireland" />
        </label>

        <label class="field">
          <span>Date spotted</span>
          <input id="dateInput" name="spotted_on" type="date" required />
        </label>
      </div>

      <label class="field">
        <span>Note</span>
        <textarea
          id="noteInput"
          name="note"
          maxlength="500"
          rows="3"
          placeholder="Optional — lamp post, hostel bathroom, mountain hut…"
        ></textarea>
      </label>

      <p id="formMessage" class="form-message" aria-live="polite"></p>

      <div class="dialog-actions">
        <button id="cancelDialog" class="secondary-button" type="button">Cancel</button>
        <button id="submitButton" class="primary-button" type="submit">Add to the map</button>
      </div>
    </form>
  </dialog>

  <script>
    // Leave these blank for local/demo mode.
    // Later, Supabase details can be entered here to make it a shared global map.
    window.NETT_HIER_CONFIG = {
      supabaseUrl: "",
      supabaseAnonKey: "",
      photoBucket: "sticker-photos"
    };
  </script>

  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <script src="https://unpkg.com/leaflet.markercluster@1.5.3/dist/leaflet.markercluster.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <script>
    if (!window.L) {
      document.body.innerHTML =
        '<div style="font-family:Arial,sans-serif;padding:30px;max-width:700px">' +
        '<h1>Nett hier. Sticker Map</h1>' +
        '<p>The map library could not load. Make sure you are connected to the internet, then close and reopen this file.</p>' +
        '</div>';
    } else {
(() => {
  "use strict";

  const config = window.NETT_HIER_CONFIG || {
    supabaseUrl: "",
    supabaseAnonKey: "",
    photoBucket: "sticker-photos"
  };
  const globalMode =
    Boolean(config.supabaseUrl) &&
    Boolean(config.supabaseAnonKey) &&
    !String(config.supabaseUrl).includes("YOUR_") &&
    !String(config.supabaseAnonKey).includes("YOUR_");

  const db =
    globalMode && window.supabase
      ? window.supabase.createClient(config.supabaseUrl, config.supabaseAnonKey)
      : null;

  const state = {
    adding: false,
    selectedLatLng: null,
    spots: [],
    previewUrl: null
  };

  const els = {
    mapShell: document.querySelector(".map-shell"),
    spotCount: document.getElementById("spotCount"),
    addButton: document.getElementById("addButton"),
    cancelAddMode: document.getElementById("cancelAddMode"),
    addModeNotice: document.getElementById("addModeNotice"),
    mapIntro: document.getElementById("mapIntro"),
    modeBadge: document.getElementById("modeBadge"),
    dialog: document.getElementById("sightingDialog"),
    form: document.getElementById("sightingForm"),
    closeDialog: document.getElementById("closeDialog"),
    cancelDialog: document.getElementById("cancelDialog"),
    coordinateText: document.getElementById("coordinateText"),
    photoInput: document.getElementById("photoInput"),
    photoPreviewWrap: document.getElementById("photoPreviewWrap"),
    photoPreview: document.getElementById("photoPreview"),
    placeInput: document.getElementById("placeInput"),
    dateInput: document.getElementById("dateInput"),
    noteInput: document.getElementById("noteInput"),
    formMessage: document.getElementById("formMessage"),
    submitButton: document.getElementById("submitButton")
  };

  const map = L.map("map", {
    worldCopyJump: true,
    minZoom: 2,
    zoomControl: true
  }).setView([23, 8], 2);

  L.tileLayer("https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png", {
    maxZoom: 19,
    attribution: "&copy; OpenStreetMap contributors"
  }).addTo(map);

  const markerLayer = L.markerClusterGroup({
    showCoverageOnHover: false,
    maxClusterRadius: 45,
    spiderfyOnMaxZoom: true
  });
  map.addLayer(markerLayer);

  const markerIcon = L.divIcon({
    className: "",
    html: '<div class="nett-marker"><span>N</span></div>',
    iconSize: [30, 30],
    iconAnchor: [15, 29],
    popupAnchor: [0, -28]
  });

  function localDateValue() {
    const d = new Date();
    const y = d.getFullYear();
    const m = String(d.getMonth() + 1).padStart(2, "0");
    const day = String(d.getDate()).padStart(2, "0");
    return `${y}-${m}-${day}`;
  }

  els.dateInput.value = localDateValue();

  els.modeBadge.textContent = globalMode
    ? "Live shared map"
    : "Demo mode · sightings save only on this device";

  function setAdding(on) {
    state.adding = Boolean(on);
    els.mapShell.classList.toggle("adding", state.adding);
    els.addModeNotice.hidden = !state.adding;
    els.mapIntro.hidden = state.adding;
    els.addButton.setAttribute("aria-pressed", String(state.adding));
  }

  els.addButton.addEventListener("click", () => setAdding(!state.adding));
  els.cancelAddMode.addEventListener("click", () => setAdding(false));

  map.on("click", (event) => {
    if (!state.adding) return;
    state.selectedLatLng = event.latlng;
    setAdding(false);
    openDialog();
  });

  function openDialog() {
    const { lat, lng } = state.selectedLatLng;
    els.coordinateText.textContent =
      `Pinned at ${lat.toFixed(5)}, ${lng.toFixed(5)} · drag/zoom the map first if you need a more exact spot.`;

    els.formMessage.textContent = "";
    els.formMessage.classList.remove("success");
    els.submitButton.disabled = false;
    els.submitButton.textContent = "Add to the map";

    if (typeof els.dialog.showModal === "function") {
      els.dialog.showModal();
    } else {
      els.dialog.setAttribute("open", "");
    }
  }

  function closeDialog() {
    if (state.previewUrl) {
      URL.revokeObjectURL(state.previewUrl);
      state.previewUrl = null;
    }
    els.photoPreviewWrap.hidden = true;
    els.photoPreview.removeAttribute("src");
    els.form.reset();
    els.dateInput.value = localDateValue();
    state.selectedLatLng = null;

    if (typeof els.dialog.close === "function") {
      els.dialog.close();
    } else {
      els.dialog.removeAttribute("open");
    }
  }

  els.closeDialog.addEventListener("click", closeDialog);
  els.cancelDialog.addEventListener("click", closeDialog);

  els.dialog.addEventListener("click", (event) => {
    if (event.target === els.dialog) closeDialog();
  });

  els.photoInput.addEventListener("change", () => {
    const file = els.photoInput.files && els.photoInput.files[0];
    if (!file) {
      els.photoPreviewWrap.hidden = true;
      return;
    }

    if (!file.type.startsWith("image/")) {
      els.formMessage.textContent = "Please choose an image file.";
      els.photoInput.value = "";
      return;
    }

    if (state.previewUrl) URL.revokeObjectURL(state.previewUrl);
    state.previewUrl = URL.createObjectURL(file);
    els.photoPreview.src = state.previewUrl;
    els.photoPreviewWrap.hidden = false;
    els.formMessage.textContent = "";
  });

  async function imageToBlob(file, maxDimension, quality) {
    const image = await loadImage(file);
    const scale = Math.min(1, maxDimension / Math.max(image.width, image.height));
    const width = Math.max(1, Math.round(image.width * scale));
    const height = Math.max(1, Math.round(image.height * scale));

    const canvas = document.createElement("canvas");
    canvas.width = width;
    canvas.height = height;

    const ctx = canvas.getContext("2d");
    ctx.drawImage(image, 0, 0, width, height);

    return await new Promise((resolve, reject) => {
      canvas.toBlob(
        (blob) => (blob ? resolve(blob) : reject(new Error("Could not process image."))),
        "image/jpeg",
        quality
      );
    });
  }

  function loadImage(file) {
    return new Promise((resolve, reject) => {
      const url = URL.createObjectURL(file);
      const image = new Image();
      image.onload = () => {
        URL.revokeObjectURL(url);
        resolve(image);
      };
      image.onerror = () => {
        URL.revokeObjectURL(url);
        reject(new Error("Could not read that image."));
      };
      image.src = url;
    });
  }

  function blobToDataUrl(blob) {
    return new Promise((resolve, reject) => {
      const reader = new FileReader();
      reader.onload = () => resolve(reader.result);
      reader.onerror = reject;
      reader.readAsDataURL(blob);
    });
  }

  function safeText(value, max) {
    return String(value || "").trim().slice(0, max);
  }

  function validateLatLng(lat, lng) {
    return (
      Number.isFinite(lat) &&
      Number.isFinite(lng) &&
      lat >= -90 &&
      lat <= 90 &&
      lng >= -180 &&
      lng <= 180
    );
  }

  els.form.addEventListener("submit", async (event) => {
    event.preventDefault();

    if (!state.selectedLatLng) {
      els.formMessage.textContent = "Please choose a point on the map first.";
      return;
    }

    const file = els.photoInput.files && els.photoInput.files[0];
    if (!file) {
      els.formMessage.textContent = "A photo is required.";
      return;
    }

    if (file.size > 20 * 1024 * 1024) {
      els.formMessage.textContent = "That image is too large. Please choose one under 20 MB.";
      return;
    }

    const lat = Number(state.selectedLatLng.lat);
    const lng = Number(state.selectedLatLng.lng);
    if (!validateLatLng(lat, lng)) {
      els.formMessage.textContent = "That map position is invalid. Please pick the spot again.";
      return;
    }

    const place = safeText(els.placeInput.value, 120);
    const note = safeText(els.noteInput.value, 500);
    const spottedOn = els.dateInput.value || localDateValue();

    els.submitButton.disabled = true;
    els.submitButton.textContent = globalMode ? "Uploading…" : "Saving…";
    els.formMessage.textContent = "";

    try {
      let imageUrl;
      let newSpot;

      if (globalMode) {
        const compressed = await imageToBlob(file, 1600, 0.84);
        const fileName = `${crypto.randomUUID()}.jpg`;
        const bucket = config.photoBucket || "sticker-photos";

        const uploadResult = await db.storage
          .from(bucket)
          .upload(fileName, compressed, {
            contentType: "image/jpeg",
            upsert: false
          });

        if (uploadResult.error) throw uploadResult.error;

        const publicUrlResult = db.storage.from(bucket).getPublicUrl(fileName);
        imageUrl = publicUrlResult.data.publicUrl;

        const row = {
          lat,
          lng,
          place: place || null,
          note: note || null,
          spotted_on: spottedOn,
          image_url: imageUrl
        };

        const insertResult = await db
          .from("spots")
          .insert(row)
          .select("id, lat, lng, place, note, spotted_on, image_url, created_at")
          .single();

        if (insertResult.error) {
          await db.storage.from(bucket).remove([fileName]);
          throw insertResult.error;
        }

        newSpot = insertResult.data;
      } else {
        const compressed = await imageToBlob(file, 950, 0.72);
        imageUrl = await blobToDataUrl(compressed);
        newSpot = {
          id: crypto.randomUUID(),
          lat,
          lng,
          place: place || null,
          note: note || null,
          spotted_on: spottedOn,
          image_url: imageUrl,
          created_at: new Date().toISOString()
        };

        const current = readLocalSpots();
        current.unshift(newSpot);

        try {
          localStorage.setItem("nett-hier-spots-v1", JSON.stringify(current));
        } catch (err) {
          throw new Error(
            "This browser has run out of demo storage. Connect Supabase for proper photo storage."
          );
        }
      }

      state.spots.unshift(newSpot);
      addMarker(newSpot);
      updateCount();
      els.formMessage.textContent = "Added!";
      els.formMessage.classList.add("success");

      const savedLatLng = [newSpot.lat, newSpot.lng];
      setTimeout(() => {
        closeDialog();
        map.setView(savedLatLng, Math.max(map.getZoom(), 10), { animate: true });
      }, 450);
    } catch (error) {
      console.error(error);
      els.formMessage.classList.remove("success");
      els.formMessage.textContent =
        error && error.message
          ? error.message
          : "Something went wrong while saving this sighting.";
      els.submitButton.disabled = false;
      els.submitButton.textContent = "Add to the map";
    }
  });

  function readLocalSpots() {
    try {
      const parsed = JSON.parse(localStorage.getItem("nett-hier-spots-v1") || "[]");
      return Array.isArray(parsed) ? parsed : [];
    } catch {
      return [];
    }
  }

  function buildPopup(spot) {
    const card = document.createElement("div");
    card.className = "popup-card";

    const image = document.createElement("img");
    image.src = spot.image_url;
    image.alt = spot.place ? `Sticker sighting in ${spot.place}` : "Sticker sighting";
    image.loading = "lazy";
    card.appendChild(image);

    const title = document.createElement("strong");
    title.textContent = spot.place || "Nett hier. spotted here";
    card.appendChild(title);

    const date = document.createElement("time");
    date.dateTime = spot.spotted_on || "";
    date.textContent = formatDate(spot.spotted_on);
    card.appendChild(date);

    if (spot.note) {
      const note = document.createElement("p");
      note.textContent = spot.note;
      card.appendChild(note);
    }

    return card;
  }

  function formatDate(value) {
    if (!value || !/^\d{4}-\d{2}-\d{2}$/.test(value)) return "Date not supplied";
    const [year, month, day] = value.split("-").map(Number);
    return new Intl.DateTimeFormat(undefined, {
      day: "numeric",
      month: "short",
      year: "numeric"
    }).format(new Date(Date.UTC(year, month - 1, day)));
  }

  function addMarker(spot) {
    const marker = L.marker([spot.lat, spot.lng], { icon: markerIcon });
    marker.bindPopup(buildPopup(spot), { maxWidth: 240 });
    markerLayer.addLayer(marker);
  }

  function renderSpots() {
    markerLayer.clearLayers();
    for (const spot of state.spots) {
      if (validateLatLng(Number(spot.lat), Number(spot.lng)) && spot.image_url) {
        addMarker(spot);
      }
    }
    updateCount();
  }

  function updateCount() {
    els.spotCount.textContent = String(state.spots.length);
  }

  async function loadSpots() {
    try {
      if (globalMode) {
        const result = await db
          .from("spots")
          .select("id, lat, lng, place, note, spotted_on, image_url, created_at")
          .order("created_at", { ascending: false })
          .limit(5000);

        if (result.error) throw result.error;
        state.spots = result.data || [];
      } else {
        state.spots = readLocalSpots();
      }
      renderSpots();
    } catch (error) {
      console.error(error);
      els.modeBadge.textContent = globalMode
        ? "Could not load live sightings — check Supabase setup"
        : els.modeBadge.textContent;
    }
  }

  loadSpots();
})();

    }
  </script>
</body>
</html>
